name: CI

# No push trigger: cd.yml calls this workflow on every push to main.
# Pull requests run CI directly.
on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    # MongoDB and Redis services for integration tests.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/node_auth_test
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: node-auth-job-be:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image boots and serves /health
        shell: bash
        run: |
          set -euo pipefail

          docker network create ci-net

          cleanup() {
            docker rm -f api mongo redis 2>/dev/null || true
            docker network rm ci-net 2>/dev/null || true
          }

          trap cleanup EXIT

          # Start MongoDB
          docker run -d \
            --name mongo \
            --network ci-net \
            mongo:7

          # Start Redis
          docker run -d \
            --name redis \
            --network ci-net \
            redis:7-alpine \
            redis-server --appendonly yes

          # Wait for MongoDB and Redis
          for i in $(seq 1 30); do
            mongo_ready=$(docker exec mongo \
              mongosh --quiet --eval \
              "db.runCommand({ ping: 1 }).ok" 2>/dev/null || true)

            redis_ready=$(docker exec redis \
              redis-cli ping 2>/dev/null || true)

            if [ "$mongo_ready" = "1" ] && \
               [ "$redis_ready" = "PONG" ]; then
              echo "MongoDB and Redis are ready"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "MongoDB or Redis failed to become ready"
              docker logs mongo
              docker logs redis
              exit 1
            fi

            sleep 2
          done

          # Start API
          docker run -d \
            --name api \
            --network ci-net \
            -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e MONGO_URI="mongodb://mongo:27017/smoke" \
            -e REDIS_URL="redis://redis:6379" \
            -e JWT_ACCESS_SECRET=ci_only \
            -e JWT_REFRESH_SECRET=ci_only \
            -e ACCESS_TOKEN_EXPIRES_IN=15m \
            -e REFRESH_TOKEN_EXPIRES_IN=7d \
            node-auth-job-be:ci

          # Wait for API health
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 \
              http://localhost:4000/health; then

              echo "Image healthy"
              exit 0
            fi

            sleep 3
          done

          echo "Image failed health check"
          docker logs api
          exit 1
