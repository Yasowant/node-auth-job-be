name: CI

# Pull requests run CI directly.
# CD calls this workflow on every push to main.

on:
  pull_request:
    branches: [main]

  workflow_call:
    secrets:
      UPSTASH_REDIS_REST_URL_TEST:
        required: true
      UPSTASH_REDIS_REST_TOKEN_TEST:
        required: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/node_auth_test

      # Upstash Redis test database
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL_TEST }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN_TEST }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Build and smoke test Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: node-auth-job-be:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        shell: bash
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL_TEST }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN_TEST }}
        run: |
          set -euo pipefail

          docker network create ci-net

          cleanup() {
            docker rm -f api mongo kafka 2>/dev/null || true
            docker network rm ci-net 2>/dev/null || true
          }

          trap cleanup EXIT

          # -----------------------------------------
          # Start MongoDB
          # -----------------------------------------
          echo "Starting MongoDB..."

          docker run -d \
            --name mongo \
            --network ci-net \
            mongo:7

          # -----------------------------------------
          # Start Kafka
          # -----------------------------------------
          echo "Starting Kafka..."

          docker run -d \
            --name kafka \
            --network ci-net \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk \
            apache/kafka:3.8.0

          # -----------------------------------------
          # Wait for MongoDB and Kafka
          # -----------------------------------------
          echo "Waiting for MongoDB and Kafka..."

          for i in $(seq 1 45); do
            mongo_ready=$(
              docker exec mongo \
                mongosh --quiet --eval \
                "db.runCommand({ ping: 1 }).ok" \
                2>/dev/null || true
            )

            kafka_ready=$(
              docker exec kafka \
                /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server localhost:9092 \
                >/dev/null 2>&1 \
                && echo "ready" || true
            )

            if [ "$mongo_ready" = "1" ] && \
               [ "$kafka_ready" = "ready" ]; then
              echo "MongoDB and Kafka are ready"
              break
            fi

            if [ "$i" -eq 45 ]; then
              echo "MongoDB or Kafka failed to become ready"

              echo "MongoDB logs:"
              docker logs mongo

              echo "Kafka logs:"
              docker logs kafka

              exit 1
            fi

            sleep 2
          done

          # -----------------------------------------
          # Start API
          # -----------------------------------------
          echo "Starting API..."

          docker run -d \
            --name api \
            --network ci-net \
            -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e MONGO_URI=mongodb://mongo:27017/smoke \
            -e KAFKA_BROKER=kafka:9092 \
            -e UPSTASH_REDIS_REST_URL="$UPSTASH_REDIS_REST_URL" \
            -e UPSTASH_REDIS_REST_TOKEN="$UPSTASH_REDIS_REST_TOKEN" \
            -e JWT_ACCESS_SECRET=ci_only_access_secret \
            -e JWT_REFRESH_SECRET=ci_only_refresh_secret \
            -e ACCESS_TOKEN_EXPIRES_IN=15m \
            -e REFRESH_TOKEN_EXPIRES_IN=7d \
            node-auth-job-be:ci

          # -----------------------------------------
          # Wait for API health
          # -----------------------------------------
          echo "Waiting for API health..."

          for i in $(seq 1 40); do
            body=$(
              curl -fsS \
                --max-time 5 \
                http://localhost:4000/health \
                2>/dev/null || true
            )

            if echo "$body" | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "Image healthy:"
              echo "$body"
              exit 0
            fi

            echo "Attempt $i: API is not healthy yet"
            sleep 3
          done

          echo "Image failed health check"
          docker logs api

          exit 1
