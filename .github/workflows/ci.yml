name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    # A real MongoDB, so tests run against the same engine as production.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/node_auth_test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: node-auth-job-be:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image boots and serves /health
        run: |
          docker network create ci-net
          docker run -d --name mongo --network ci-net mongo:7
          sleep 8

          docker run -d --name api --network ci-net -p 4000:4000 \
            -e MONGO_URI="mongodb://mongo:27017/smoke" \
            -e JWT_ACCESS_SECRET=ci_only \
            -e JWT_REFRESH_SECRET=ci_only \
            -e ACCESS_TOKEN_EXPIRES_IN=15m \
            -e REFRESH_TOKEN_EXPIRES_IN=7d \
            node-auth-job-be:ci

          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4000/health; then
              echo "Image healthy"
              docker rm -f api mongo
              exit 0
            fi
            sleep 3
          done

          echo "Image failed health check"
          docker logs api
          exit 1
