name: CD

# Deploys to the EC2 instance only when CI is green on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Re-use the CI workflow so nothing ships without passing tests.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE_LOWER}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_LOWER=${IMAGE_LOWER}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_LOWER }}:latest
            ${{ env.IMAGE_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment is optional: until a server exists and its secrets are set, the
  # deploy job is skipped rather than failed. A missing server is a state this
  # project can legitimately be in - it is not a broken build.
  preflight:
    name: Check deploy configuration
    runs-on: ubuntu-latest
    needs: build

    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Look for the deploy secrets
        id: check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          missing=""
          [ -z "$EC2_HOST" ]    && missing="$missing EC2_HOST"
          [ -z "$EC2_USER" ]    && missing="$missing EC2_USER"
          [ -z "$EC2_SSH_KEY" ] && missing="$missing EC2_SSH_KEY"
          [ -z "$GHCR_TOKEN" ]  && missing="$missing GHCR_TOKEN"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped - not configured yet. Missing:$missing"
            echo ""
            echo "The image built and was pushed to GHCR successfully."
            echo "It is ready to deploy as soon as a server exists."
            echo "See docs/DEPLOYMENT.md, and scripts/server-setup.sh."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All deploy secrets present - proceeding to deploy."
          fi

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build, preflight]
    if: needs.preflight.outputs.configured == 'true'
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            IMAGE="${{ needs.build.outputs.image }}:${{ github.sha }}"

            echo "${{ secrets.GHCR_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker pull "$IMAGE"

            # Keep the previous image id so we can roll back if health fails.
            PREVIOUS=$(docker inspect --format='{{.Image}}' node-auth 2>/dev/null || echo "")

            docker rm -f node-auth 2>/dev/null || true

            docker run -d \
              --name node-auth \
              --restart unless-stopped \
              --env-file /opt/node-auth/.env \
              -p 127.0.0.1:4000:4000 \
              "$IMAGE"

            # Wait for the container to report healthy.
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:4000/health > /dev/null; then
                echo "Health check passed on attempt $i"
                docker image prune -f
                exit 0
              fi
              sleep 3
            done

            echo "Health check failed - rolling back"
            docker logs --tail 50 node-auth || true
            docker rm -f node-auth || true

            if [ -n "$PREVIOUS" ]; then
              docker run -d --name node-auth --restart unless-stopped \
                --env-file /opt/node-auth/.env \
                -p 127.0.0.1:4000:4000 "$PREVIOUS"
              echo "Rolled back to previous image"
            fi

            exit 1
