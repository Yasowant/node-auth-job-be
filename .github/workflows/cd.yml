name: CD

# Render watches this repository and redeploys itself on every push to main.
# This workflow runs the test suite and then confirms the new version
# actually came up healthy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify the live deployment
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Wait for Render and check /health
        env:
          # Override by setting a repository variable named RENDER_URL.
          # Settings > Secrets and variables > Actions > Variables.
          BASE_URL: ${{ vars.RENDER_URL || 'https://node-auth-job-backend.onrender.com' }}

        shell: bash
        run: |
          set -euo pipefail

          echo "Checking $BASE_URL/health"
          echo "Render builds take a few minutes; free instances also cold start."

          for attempt in $(seq 1 24); do
            body=$(curl -fsS \
              --max-time 60 \
              "$BASE_URL/health" 2>/dev/null || echo "")

            if echo "$body" | grep -q '"status":"ok"'; then
              echo ""
              echo "Live and healthy on attempt $attempt:"
              echo "$body"
              echo ""

              {
                echo "### Deployment verified"
                echo ""
                echo "- URL: $BASE_URL"
                echo "- Health: \`$body\`"
              } >> "$GITHUB_STEP_SUMMARY"

              exit 0
            fi

            if echo "$body" | grep -q '"database":"disconnected"'; then
              echo "Attempt $attempt: app is up but cannot reach MongoDB."
            elif echo "$body" | grep -q '"redis":"disconnected"'; then
              echo "Attempt $attempt: app is up but cannot reach Redis."
            else
              echo "Attempt $attempt: not ready yet."
            fi

            sleep 30
          done

          echo "::error::$BASE_URL/health did not report healthy within 12 minutes."
          echo "Check the Render dashboard logs for this service."
          exit 1
