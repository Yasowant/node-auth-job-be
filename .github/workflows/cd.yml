name: CD

# Render watches this repository and redeploys on pushes to main.
# This workflow runs CI and then verifies the Render deployment.

on:
  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  verify:
    name: Verify the live deployment
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Wait for Render and check health
        env:
          # Optional repository variable:
          # Settings → Secrets and variables → Actions → Variables
          BASE_URL: ${{ vars.RENDER_URL || 'https://node-auth-job-backend.onrender.com' }}

        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${BASE_URL%/}"

          echo "Checking $BASE_URL/health"
          echo "Render builds can take several minutes."
          echo "Free instances may also cold start."

          for attempt in $(seq 1 24); do
            body=$(
              curl -fsS \
                --max-time 60 \
                "$BASE_URL/health" \
                2>/dev/null || true
            )

            if echo "$body" | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo ""
              echo "Live and healthy on attempt $attempt:"
              echo "$body"
              echo ""

              {
                echo "### Deployment verified"
                echo ""
                echo "- URL: $BASE_URL"
                echo "- Health response:"
                echo '```json'
                echo "$body"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"

              exit 0
            fi

            if echo "$body" | jq -e '.database == "disconnected"' >/dev/null 2>&1; then
              echo "Attempt $attempt: MongoDB is disconnected."

            elif echo "$body" | jq -e '.redis == "disconnected"' >/dev/null 2>&1; then
              echo "Attempt $attempt: Redis is disconnected."

            elif [ -n "$body" ]; then
              echo "Attempt $attempt: API responded but is not healthy."
              echo "$body"

            else
              echo "Attempt $attempt: API is not responding yet."
            fi

            sleep 30
          done

          echo "::error::$BASE_URL/health did not report healthy within 12 minutes."
          echo "Check Render deployment logs."
          exit 1
